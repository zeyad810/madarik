<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="260" y1="160" x2="340" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGradient)" rx="16" />
  
  <!-- Subtle pattern grid -->
  <g opacity="0.15" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
  </g>

  <!-- Photo / Image Frame Icon -->
  <g transform="translate(250, 150)">
    <rect x="0" y="0" width="100" height="80" rx="12" fill="white" stroke="#CBD5E1" stroke-width="3" />
    
    <!-- Mountain / landscape -->
    <path d="M12 65L38 35L55 52L68 38L88 65H12Z" fill="url(#iconGradient)" opacity="0.7" />
    
    <!-- Sun / Circle -->
    <circle cx="34" cy="24" r="8" fill="#FBBF24" />
    
    <!-- Broken crack diagonal line -->
    <path d="M30 0L70 80" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.6" />
  </g>

  <!-- Text -->
  <text x="300" y="270" text-anchor="middle" fill="#64748B" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
    لا تتوفر صورة
  </text>
</svg>
