name: Development Pipeline

# INFO: Trigger Section
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: are you want to trigger development deployment
        type: choice
        required: true
        default: "false"
        options: ["true", "false"]
# INFO: Jobs Section
jobs:
  trigger-jenkins:
    name: Trigger Jenkins Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Jenkins
        run: |
          curl --fail-with-body -X POST \
            "${{ secrets.JENKINS_URL }}/job/TWorkSpace/job/madarik_workflows/job/madarik_admin/buildWithParameters" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            --data-urlencode "environment=development"
